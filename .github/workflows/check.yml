# 押すたびに、型・lint・テストを確かめる（秘密の値は使わない）
name: check
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
